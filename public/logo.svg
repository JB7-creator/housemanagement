<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <!-- Background Gradient for Icon Mark -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Blue Gradient -->
    <linearGradient id="logoElectricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387DFF" />
      <stop offset="60%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#00287D" />
    </linearGradient>

    <!-- Kenyan Harmony Emerald Gradient -->
    <linearGradient id="logoEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="40%" stop-color="#F5EAC4" />
      <stop offset="80%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#916E18" />
    </linearGradient>

    <filter id="logoCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left: 48x48 centered in 56x56) -->
  <g transform="translate(4, 4)">
    <!-- Squircle Backdrop -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#logoBgGrad)" stroke="#1E293B" stroke-width="1.2" />

    <!-- 1. Roof Gable / Fulcrum -->
    <path d="M 24 7.5 L 10.5 16.5 L 13.5 20 L 24 13 L 24 7.5 Z" fill="url(#logoElectricGrad)" />
    <path d="M 24 7.5 L 37.5 16.5 L 34.5 20 L 24 13 L 24 7.5 Z" fill="url(#logoEmeraldGrad)" />

    <!-- 2. Balanced Living Chambers -->
    <path d="M 10 19 L 16 19 L 18.5 28 L 12.5 33 L 7.5 28 L 10 19 Z" fill="url(#logoElectricGrad)" opacity="0.95" />
    <path d="M 38 19 L 32 19 L 29.5 28 L 35.5 33 L 40.5 28 L 38 19 Z" fill="url(#logoEmeraldGrad)" opacity="0.95" />

    <!-- 3. Equilibrium Datum Bar -->
    <line x1="15" y1="26" x2="33" y2="26" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5 2" opacity="0.8" />

    <!-- Anchor Foundation -->
    <path d="M 20.5 38 L 24 35 L 27.5 38 L 24 41 Z" fill="#334155" opacity="0.8" />
    <line x1="24" y1="32" x2="24" y2="35" stroke="#475569" stroke-width="1.2" />

    <!-- 4. AI Keystone Spark -->
    <g filter="url(#logoCoreGlow)">
      <path 
        d="M 24 18.5 
           C 24.6 22.8 26 24.2 30.5 25 
           C 26 25.8 24.6 27.2 24 31.5 
           C 23.4 27.2 22 25.8 17.5 25 
           C 22 24.2 23.4 22.8 24 18.5 Z" 
        fill="url(#logoGoldGrad)" 
      />
      <circle cx="24" cy="25" r="1.2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- TYPOGRAPHY (Right) -->
  <g transform="translate(62, 14)">
    <!-- "Room" (Medium/Bold Dark Slate) -->
    <text x="0" y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="-0.5">
      Room<tspan font-weight="800" fill="#0052FF">Justice</tspan>
    </text>

    <!-- Subtitle: Algorithmic Co-Living OS -->
    <text x="1" y="34" font-family="'Outfit', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="1.2">
      ALGORITHMIC CO-LIVING
    </text>

    <!-- AI Spark Pill Badge -->
    <g transform="translate(132, 7)">
      <rect x="0" y="0" width="28" height="15" rx="7.5" fill="#FDFBF4" stroke="#D4AF37" stroke-width="1" />
      <text x="14" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" fill="#916E18" text-anchor="middle">
        AI
      </text>
    </g>
  </g>
</svg>
